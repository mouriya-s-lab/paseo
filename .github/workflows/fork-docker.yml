name: Fork Docker

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/**"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "fork-features/**"
      - "tsconfig*.json"
      - "packages/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  # Build-only verification of an unpublished commit, used by sync-upstream.yml
  # before it fast-forwards main. Nothing is pushed or tagged in this mode.
  workflow_call:
    inputs:
      ref:
        description: Commit to build without publishing
        required: true
        type: string
    outputs:
      built:
        description: "'true' only when both images built from inputs.ref"
        value: ${{ jobs.docker.outputs.built }}

permissions:
  contents: read

# Only one pending run per group survives, so each kind of build gets its own
# group: a queued publish must not replace a pending sync verification or a
# PR build, and PR builds of different branches must not replace each other.
concurrency:
  group: >-
    ${{ inputs.ref && format('paseo-docker-verify-{0}', inputs.ref)
    || github.event_name == 'pull_request' && format('paseo-docker-pr-{0}', github.ref)
    || 'paseo-docker-fork' }}
  cancel-in-progress: false

env:
  REGISTRY: registry.237575.xyz
  IMAGE: registry.237575.xyz/paseo/paseo
  WEB_IMAGE: registry.237575.xyz/paseo/paseo-web
  UPSTREAM_REPOSITORY: https://github.com/getpaseo/paseo.git

jobs:
  docker:
    # Public fork PRs must not execute untrusted code on the mesh runner.
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || inputs.ref)
    # `cachyos` exists only on the edge Incus pool (CachyOS laptop, 30 GiB). The
    # resident VM 181 LXD runners share 4 GiB, which OOM-kills `expo export`
    # (paseo#20, pve-vctcn#300).
    runs-on: [self-hosted, linux, vctcn, netbird, x64, cachyos]
    permissions:
      contents: write
    outputs:
      built: ${{ steps.built.outputs.built }}
      # 'true' only when this run pushed the pair, moved `latest` and tagged
      # the commit. The deploy job reads it; "Re-run failed jobs" keeps it.
      published: ${{ steps.published.outputs.published }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve upstream and fork release
        id: release
        if: github.event_name != 'pull_request' && !inputs.ref
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          git fetch --tags upstream
          git fetch --tags origin
          release_json="$(node fork-features/release/fork-release-version.mjs --ref "$RELEASE_REF")"
          RELEASE_JSON="$release_json" node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON ?? "");
          for (const [key, value] of Object.entries(release)) {
            if (typeof value === "string" && value.includes("\n")) {
              throw new Error(`Release output ${key} contains a newline`);
            }
            console.log(`${key}=${value}`);
          }
          NODE

      - name: Resolve image build values
        id: values
        env:
          RELEASE_TAG: ${{ steps.release.outputs.releaseTag }}
          IMAGE_TAG: ${{ steps.release.outputs.imageTag }}
          BASE_VERSION: ${{ steps.release.outputs.baseVersion }}
          ALREADY_PUBLISHED: ${{ steps.release.outputs.alreadyPublished }}
          VERIFY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || -n "$VERIFY_REF" ]]; then
            base_version="$(node -p "require('./package.json').version")"
            build_sha="$(git rev-parse HEAD)"
            image_tag="build-${build_sha:0:12}"
            fork_version=""
            push=false
            skip=false
          else
            base_version="$BASE_VERSION"
            image_tag="$IMAGE_TAG"
            fork_version="$IMAGE_TAG"
            push=true
            skip="$ALREADY_PUBLISHED"
            test -n "$RELEASE_TAG"
            test -n "$base_version"
            test "$(node -p "require('./package.json').version")" = "$base_version"
          fi

          {
            echo "base_version=$base_version"
            echo "image_tag=$image_tag"
            echo "fork_version=$fork_version"
            echo "push=$push"
            echo "skip=$skip"
            echo "revision=$(git rev-parse HEAD)"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      # The two role images are one release: both are built, pushed and verified
      # under the same exact tag before either `latest` moves and before the fork
      # Git tag exists. They build sequentially; each runs a full Expo export.
      - name: Build daemon image
        if: steps.values.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64
          build-args: |
            PASEO_VERSION=${{ steps.values.outputs.base_version }}
            PASEO_FORK_VERSION=${{ steps.values.outputs.fork_version }}
            EXPO_PUBLIC_PASEO_SELFHOSTED=false
            EXPO_PUBLIC_LOCAL_DAEMON=self-hosted
          tags: ${{ env.IMAGE }}:${{ steps.values.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: false
          load: ${{ steps.values.outputs.push == 'true' }}
          provenance: false
          cache-from: type=gha,scope=paseo-fork
          cache-to: type=gha,scope=paseo-fork,mode=max

      - name: Build web image
        if: steps.values.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fork-features/web-image/Dockerfile
          platforms: linux/amd64
          build-args: |
            PASEO_VERSION=${{ steps.values.outputs.base_version }}
            PASEO_FORK_VERSION=${{ steps.values.outputs.fork_version }}
            PASEO_REVISION=${{ steps.values.outputs.revision }}
          tags: ${{ env.WEB_IMAGE }}:${{ steps.values.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: false
          load: ${{ steps.values.outputs.push == 'true' }}
          provenance: false
          cache-from: type=gha,scope=paseo-fork-web
          cache-to: type=gha,scope=paseo-fork-web,mode=max

      - name: Record that both images built
        id: built
        if: steps.values.outputs.skip != 'true'
        run: echo "built=true" >> "$GITHUB_OUTPUT"

      # Log in only after both builds: the Keycloak token is the Docker password
      # and lives 30 minutes (pve-vctcn apps/registry). Fetched before two Expo
      # builds, it expired during the second image's push (run 37431893121).
      - name: Fetch registry token
        id: registry-token
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        uses: Mouriya-Emma/keycloak-token-action@v1
        with:
          keycloak-url: https://keycloak.237575.xyz
          realm: registry
          client-id: registry
          client-secret: ${{ secrets.KEYCLOAK_REGISTRY_CLIENT_SECRET }}

      - name: Log in to private registry
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        run: echo "${{ steps.registry-token.outputs.access-token }}" | docker login "$REGISTRY" -u sa-registry --password-stdin

      # Push from the runner's Docker daemon: registry-mesh-hosts.sh writes the
      # registry mesh override into the runner instance's /etc/hosts. BuildKit's
      # builder container instead resolves the public IP via embedded DNS; the
      # resident runner on OVH cannot hairpin to it.
      # GARM self-hosted runners use resident LXD on VM 181 or edge Incus on the
      # operator's laptop; mesh reachability comes from that host's NetBird peer.
      # See https://github.com/mouriya-s-lab/pve-vctcn/blob/main/apps/runner/README.md#边缘-incus-providergarm-edge-incus
      - name: Push exact tags to private registry
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ steps.values.outputs.image_tag }}
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$WEB_IMAGE"; do
            docker push "$image:$IMAGE_TAG"
          done

      - name: Verify published exact tags
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ steps.values.outputs.image_tag }}
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$WEB_IMAGE"; do
            docker pull "$image:$IMAGE_TAG"
            test "$(docker image inspect "$image:$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          done

      # Every release, stable or prerelease, moves `latest`: it is the channel
      # the homelab `paseo` Stack runs, so the deploy job below needs no pin.
      - name: Move latest tags
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ steps.values.outputs.image_tag }}
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$WEB_IMAGE"; do
            docker tag "$image:$IMAGE_TAG" "$image:latest"
            docker push "$image:latest"
            docker pull "$image:latest"
            test "$(docker image inspect "$image:$IMAGE_TAG" --format '{{.Id}}')" = "$(docker image inspect "$image:latest" --format '{{.Id}}')"
          done

      - name: Tag the published fork commit
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.values.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Record the publication
        id: published
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  # Roll the published `latest` web image out to the homelab Komodo Stack
  # `paseo` (declared in mouriya-s-lab/homelab-apps). Runs after a publication,
  # or on a manual dispatch to redeploy the current release. The Komodo
  # endpoint and key belong to a service user that can only operate that one
  # Stack; they live in the `homelab-paseo` environment, which only `main` may
  # use, and are provisioned by the homelab Komodo IaC. This repository is
  # public: print stage results only, never Komodo logs.
  deploy:
    needs: docker
    if: >-
      !inputs.ref && github.ref == 'refs/heads/main' &&
      (needs.docker.outputs.published == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, linux, vctcn, netbird]
    environment: homelab-paseo
    env:
      APP_URL: https://paseo.237575.xyz
    steps:
      # Same scope as the manual rollout: only the App service. The test
      # daemons in the Stack stay as they are.
      - name: Deploy the App service
        env:
          KOMODO_URL: ${{ secrets.KOMODO_URL }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          set -euo pipefail
          km_post() {
            curl -fsS -X POST "${KOMODO_URL}$1" \
              -H "x-api-key: ${KOMODO_API_KEY}" \
              -H "x-api-secret: ${KOMODO_API_SECRET}" \
              -H 'Content-Type: application/json' \
              -d "$2"
          }
          response=$(km_post /execute '{"type":"DeployStack","params":{"stack":"paseo","services":["paseo"]}}')
          update_id=$(jq -er '._id."$oid"' <<<"$response")
          echo "Komodo update $update_id"
          deadline=$((SECONDS + 900))
          while true; do
            update=$(km_post /read "$(jq -nc --arg id "$update_id" '{type:"GetUpdate",params:{id:$id}}')")
            status=$(jq -er '.status' <<<"$update")
            case "$status" in
              Complete)
                jq -r '.logs[] | "stage=\(.stage) success=\(.success)"' <<<"$update"
                test "$(jq -r '.success' <<<"$update")" = true
                break
                ;;
              Queued | InProgress)
                if ((SECONDS > deadline)); then
                  echo "::error::Komodo update $update_id still $status after 15 minutes"
                  exit 1
                fi
                sleep 3
                ;;
              *)
                echo "::error::Komodo update $update_id ended in state $status"
                exit 1
                ;;
            esac
          done

      # The web image serves its build revision; the public App must report
      # the commit this run published (or, on dispatch, the current release).
      - name: Verify the App serves this release
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            served=$(curl -fsS "${APP_URL}/_paseo/version.json?run=${GITHUB_RUN_ID}-${attempt}" | jq -r '.revision' || true)
            if [[ "$served" == "$GITHUB_SHA" ]]; then
              echo "App serves revision $served"
              exit 0
            fi
            sleep 5
          done
          echo "::error::App serves revision '${served}', expected ${GITHUB_SHA}"
          exit 1
