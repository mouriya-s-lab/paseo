name: Fork Docker

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/**"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "fork-features/**"
      - "mise.toml"
      - "tsconfig*.json"
      - "packages/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}
  # Build-only verification of an unpublished commit, used by sync-upstream.yml
  # before it fast-forwards main. Nothing is pushed or tagged in this mode.
  workflow_call:
    inputs:
      ref:
        description: Commit to build without publishing
        required: true
        type: string
    outputs:
      built:
        description: "'true' only when both images built from inputs.ref"
        value: ${{ jobs.image.outputs.built }}

permissions:
  contents: read

# Only one pending run per group survives, so each kind of build gets its own
# group: a queued publish must not replace a pending sync verification or a
# PR build, and PR builds of different branches must not replace each other.
concurrency:
  group: >-
    ${{ inputs.ref && format('paseo-docker-verify-{0}', inputs.ref)
    || github.event_name == 'pull_request' && format('paseo-docker-pr-{0}', github.ref)
    || 'paseo-docker-fork' }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: https://github.com/getpaseo/paseo.git
  APP_URL: https://paseo.237575.xyz

jobs:
  # Decides what this run builds: same-repository PRs and sync candidates
  # (`inputs.ref`) build `build-<sha12>` without publishing; `main` publishes
  # the next fork release unless the commit already has one.
  release:
    # Public fork PRs must not execute untrusted code on the mesh runner.
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || inputs.ref)
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.values.outputs.mode }}
      ref: ${{ steps.values.outputs.ref }}
      tag: ${{ steps.values.outputs.tag }}
      release_tag: ${{ steps.values.outputs.release_tag }}
      skip: ${{ steps.values.outputs.skip }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Resolve upstream and fork release
        id: release
        if: github.event_name != 'pull_request' && !inputs.ref
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          git fetch --tags upstream
          git fetch --tags origin
          release_json="$(node fork-features/release/fork-release-version.mjs --ref "$RELEASE_REF")"
          RELEASE_JSON="$release_json" node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON ?? "");
          for (const [key, value] of Object.entries(release)) {
            if (typeof value === "string" && value.includes("\n")) {
              throw new Error(`Release output ${key} contains a newline`);
            }
            console.log(`${key}=${value}`);
          }
          NODE

      - name: Resolve image build values
        id: values
        env:
          RELEASE_TAG: ${{ steps.release.outputs.releaseTag }}
          IMAGE_TAG: ${{ steps.release.outputs.imageTag }}
          BASE_VERSION: ${{ steps.release.outputs.baseVersion }}
          ALREADY_PUBLISHED: ${{ steps.release.outputs.alreadyPublished }}
          VERIFY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || -n "$VERIFY_REF" ]]; then
            mode=build-only
            tag="build-${revision:0:12}"
            skip=false
          else
            mode=publish
            tag="$IMAGE_TAG"
            skip="$ALREADY_PUBLISHED"
            test -n "$RELEASE_TAG"
            test "$(node -p "require('./package.json').version")" = "$BASE_VERSION"
          fi
          {
            echo "mode=$mode"
            echo "ref=$revision"
            echo "tag=$tag"
            echo "release_tag=$RELEASE_TAG"
            echo "skip=$skip"
          } >> "$GITHUB_OUTPUT"

  # Both role images are one release: mouriya-devops/ci builds them with
  # `mise run build`, pushes both exact tags before either `latest` moves, and
  # creates the `paseo` Deployment last.
  image:
    needs: release
    if: needs.release.outputs.skip != 'true'
    permissions:
      contents: read
      deployments: write
    uses: mouriya-devops/ci/.github/workflows/image.yml@main
    with:
      # `cachyos` exists only on the edge Incus pool (CachyOS laptop, 30 GiB).
      # The resident VM 181 LXD runners share 4 GiB, which OOM-kills
      # `expo export` (paseo#20, pve-vctcn#300).
      runs-on: '["self-hosted","linux","vctcn","netbird","x64","cachyos"]'
      ref: ${{ needs.release.outputs.ref }}
      mode: ${{ needs.release.outputs.mode }}
      images: |
        registry.237575.xyz/paseo/paseo
        registry.237575.xyz/paseo/paseo-web
      tag: ${{ needs.release.outputs.tag }}
      channel: ${{ needs.release.outputs.mode == 'publish' && 'latest' || '' }}
      deployment-environment: ${{ needs.release.outputs.mode == 'publish' && 'paseo' || '' }}
    secrets:
      KEYCLOAK_REGISTRY_CLIENT_SECRET: ${{ secrets.KEYCLOAK_REGISTRY_CLIENT_SECRET }}

  # The fork tag marks the commit as published, so it is created only after
  # the images and the Deployment exist; a failed publication leaves no tag
  # and the next run publishes the same release again.
  tag:
    needs: [release, image]
    if: needs.image.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.ref }}

      - name: Tag the published fork commit
        env:
          RELEASE_TAG: ${{ needs.release.outputs.release_tag }}
          REVISION: ${{ needs.release.outputs.ref }}
        run: |
          set -euo pipefail
          existing="$(git ls-remote origin "refs/tags/$RELEASE_TAG^{}" "refs/tags/$RELEASE_TAG" | awk 'END { print $1 }')"
          if [[ "$existing" == "$REVISION" ]]; then
            echo "$RELEASE_TAG already points to $REVISION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$REVISION"
          git push origin "refs/tags/$RELEASE_TAG"

      # The web image serves its build revision; the public App must report
      # the commit this run published.
      - name: Verify the App serves this release
        env:
          REVISION: ${{ needs.release.outputs.ref }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            served=$(curl -fsS "${APP_URL}/_paseo/version.json?run=${GITHUB_RUN_ID}-${attempt}" | jq -r '.revision' || true)
            if [[ "$served" == "$REVISION" ]]; then
              echo "App serves revision $served"
              exit 0
            fi
            sleep 5
          done
          echo "::error::App serves revision '${served}', expected ${REVISION}"
          exit 1
