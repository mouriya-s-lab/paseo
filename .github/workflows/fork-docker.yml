name: Fork Docker

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/**"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "fork-features/**"
      - "tsconfig*.json"
      - "packages/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Only one pending run per group survives, so a PR build gets its own group:
# a queued publish or another branch's PR must not replace it.
concurrency:
  group: >-
    ${{ github.event_name == 'pull_request' && format('paseo-docker-pr-{0}', github.ref)
    || 'paseo-docker-fork' }}
  cancel-in-progress: false

env:
  REGISTRY: registry.237575.xyz
  IMAGE: registry.237575.xyz/paseo/paseo
  WEB_IMAGE: registry.237575.xyz/paseo/paseo-web
  UPSTREAM_REPOSITORY: https://github.com/getpaseo/paseo.git

jobs:
  docker:
    # Public fork PRs must not execute untrusted code on the mesh runner.
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    # `cachyos` exists only on the edge Incus pool (CachyOS laptop, 30 GiB). The
    # resident VM 181 LXD runners share 4 GiB, which OOM-kills `expo export`
    # (paseo#20, pve-vctcn#300).
    runs-on: [self-hosted, linux, vctcn, netbird, x64, cachyos]
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve upstream and fork release
        id: release
        if: github.event_name != 'pull_request'
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          git fetch --tags upstream
          git fetch --tags origin
          release_json="$(node fork-features/release/fork-release-version.mjs --ref "$RELEASE_REF")"
          RELEASE_JSON="$release_json" node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON ?? "");
          for (const [key, value] of Object.entries(release)) {
            if (typeof value === "string" && value.includes("\n")) {
              throw new Error(`Release output ${key} contains a newline`);
            }
            console.log(`${key}=${value}`);
          }
          NODE

      - name: Resolve image build values
        id: values
        env:
          RELEASE_TAG: ${{ steps.release.outputs.releaseTag }}
          IMAGE_TAG: ${{ steps.release.outputs.imageTag }}
          BASE_VERSION: ${{ steps.release.outputs.baseVersion }}
          PUBLISH_LATEST: ${{ steps.release.outputs.publishLatest }}
          ALREADY_PUBLISHED: ${{ steps.release.outputs.alreadyPublished }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_version="$(node -p "require('./package.json').version")"
            image_tag="pr-${GITHUB_SHA:0:12}"
            push=false
            skip=false
            publish_latest=false
          else
            base_version="$BASE_VERSION"
            image_tag="$IMAGE_TAG"
            push=true
            publish_latest="$PUBLISH_LATEST"
            skip="$ALREADY_PUBLISHED"
            test -n "$RELEASE_TAG"
            test -n "$base_version"
            test "$(node -p "require('./package.json').version")" = "$base_version"
          fi

          {
            echo "base_version=$base_version"
            echo "image_tag=$image_tag"
            echo "push=$push"
            echo "skip=$skip"
            echo "publish_latest=$publish_latest"
            echo "release_tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch registry token
        id: registry-token
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        uses: Mouriya-Emma/keycloak-token-action@v1
        with:
          keycloak-url: https://keycloak.237575.xyz
          realm: registry
          client-id: registry
          client-secret: ${{ secrets.KEYCLOAK_REGISTRY_CLIENT_SECRET }}

      - name: Log in to private registry
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        run: echo "${{ steps.registry-token.outputs.access-token }}" | docker login "$REGISTRY" -u sa-registry --password-stdin

      # The two role images are one release: both are built, pushed and verified
      # under the same exact tag before either `latest` moves and before the fork
      # Git tag exists. They build sequentially; each runs a full Expo export.
      - name: Build daemon image
        if: steps.values.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64
          build-args: |
            PASEO_VERSION=${{ steps.values.outputs.base_version }}
            EXPO_PUBLIC_PASEO_SELFHOSTED=false
            EXPO_PUBLIC_LOCAL_DAEMON=self-hosted
          tags: ${{ env.IMAGE }}:${{ steps.values.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: false
          load: ${{ steps.values.outputs.push == 'true' }}
          provenance: false
          cache-from: type=gha,scope=paseo-fork
          cache-to: type=gha,scope=paseo-fork,mode=max

      - name: Build web image
        if: steps.values.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: fork-features/web-image/Dockerfile
          platforms: linux/amd64
          build-args: |
            PASEO_VERSION=${{ steps.values.outputs.base_version }}
          tags: ${{ env.WEB_IMAGE }}:${{ steps.values.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: false
          load: ${{ steps.values.outputs.push == 'true' }}
          provenance: false
          cache-from: type=gha,scope=paseo-fork-web
          cache-to: type=gha,scope=paseo-fork-web,mode=max

      # Push from the runner's Docker daemon: registry-mesh-hosts.sh writes the
      # registry mesh override into the runner instance's /etc/hosts. BuildKit's
      # builder container instead resolves the public IP via embedded DNS; the
      # resident runner on OVH cannot hairpin to it.
      # GARM self-hosted runners use resident LXD on VM 181 or edge Incus on the
      # operator's laptop; mesh reachability comes from that host's NetBird peer.
      # See https://github.com/mouriya-s-lab/pve-vctcn/blob/main/apps/runner/README.md#边缘-incus-providergarm-edge-incus
      - name: Push exact tags to private registry
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ steps.values.outputs.image_tag }}
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$WEB_IMAGE"; do
            docker push "$image:$IMAGE_TAG"
          done

      - name: Verify published exact tags
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ steps.values.outputs.image_tag }}
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$WEB_IMAGE"; do
            docker pull "$image:$IMAGE_TAG"
            test "$(docker image inspect "$image:$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          done

      - name: Move latest tags
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true' && steps.values.outputs.publish_latest == 'true'
        env:
          IMAGE_TAG: ${{ steps.values.outputs.image_tag }}
        run: |
          set -euo pipefail
          for image in "$IMAGE" "$WEB_IMAGE"; do
            docker tag "$image:$IMAGE_TAG" "$image:latest"
            docker push "$image:latest"
            docker pull "$image:latest"
            test "$(docker image inspect "$image:$IMAGE_TAG" --format '{{.Id}}')" = "$(docker image inspect "$image:latest" --format '{{.Id}}')"
          done

      - name: Tag the published fork commit
        if: github.event_name != 'pull_request' && steps.values.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.values.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
