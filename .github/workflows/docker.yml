name: Docker

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/**"
      - "docker/**"
      - "package.json"
      - "package-lock.json"
      - "patches/**"
      - "scripts/**"
      - "tsconfig*.json"
      - "packages/**"
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: paseo-docker-fork
  cancel-in-progress: false

env:
  REGISTRY: registry.237575.xyz
  IMAGE: registry.237575.xyz/paseo/paseo
  UPSTREAM_REPOSITORY: https://github.com/getpaseo/paseo.git

jobs:
  docker:
    # Public fork PRs must not execute untrusted code on the mesh runner.
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    runs-on: [self-hosted, linux, vctcn, netbird, x64]
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve upstream and fork release
        id: release
        if: github.event_name != 'pull_request'
        env:
          RELEASE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPOSITORY" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream main
          git fetch --tags upstream
          git fetch --tags origin
          release_json="$(node scripts/fork-release-version.mjs --ref "$RELEASE_REF")"
          RELEASE_JSON="$release_json" node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          const release = JSON.parse(process.env.RELEASE_JSON ?? "");
          for (const [key, value] of Object.entries(release)) {
            if (typeof value === "string" && value.includes("\n")) {
              throw new Error(`Release output ${key} contains a newline`);
            }
            console.log(`${key}=${value}`);
          }
          NODE

      - name: Resolve image build values
        id: values
        env:
          RELEASE_TAG: ${{ steps.release.outputs.releaseTag }}
          IMAGE_TAG: ${{ steps.release.outputs.imageTag }}
          BASE_VERSION: ${{ steps.release.outputs.baseVersion }}
          PUBLISH_LATEST: ${{ steps.release.outputs.publishLatest }}
          ALREADY_PUBLISHED: ${{ steps.release.outputs.alreadyPublished }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_version="$(node -p "require('./package.json').version")"
            image_tag="pr-${GITHUB_SHA:0:12}"
            push=false
            skip=false
            publish_latest=false
          else
            base_version="$BASE_VERSION"
            image_tag="$IMAGE_TAG"
            push=true
            publish_latest="$PUBLISH_LATEST"
            skip="$ALREADY_PUBLISHED"
            test -n "$RELEASE_TAG"
            test -n "$base_version"
            test "$(node -p "require('./package.json').version")" = "$base_version"
          fi

          {
            echo "base_version=$base_version"
            echo "image_tag=$image_tag"
            echo "push=$push"
            echo "skip=$skip"
            echo "publish_latest=$publish_latest"
            echo "release_tag=$RELEASE_TAG"
            echo "tags<<EOF"
            echo "$IMAGE:$image_tag"
            if [[ "$publish_latest" == "true" ]]; then
              echo "$IMAGE:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch registry token
        id: registry-token
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        uses: Mouriya-Emma/keycloak-token-action@v1
        with:
          keycloak-url: https://keycloak.237575.xyz
          realm: registry
          client-id: registry
          client-secret: ${{ secrets.KEYCLOAK_REGISTRY_CLIENT_SECRET }}

      - name: Log in to private registry
        if: steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        run: echo "${{ steps.registry-token.outputs.access-token }}" | docker login "$REGISTRY" -u sa-registry --password-stdin

      - name: Build and publish Docker image
        if: steps.values.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/base/Dockerfile
          platforms: linux/amd64
          build-args: |
            PASEO_VERSION=${{ steps.values.outputs.base_version }}
            EXPO_PUBLIC_PASEO_SELFHOSTED=false
            EXPO_PUBLIC_LOCAL_DAEMON=self-hosted
          tags: ${{ steps.values.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ steps.values.outputs.push == 'true' }}
          provenance: false
          cache-from: type=gha,scope=paseo-fork
          cache-to: type=gha,scope=paseo-fork,mode=max

      - name: Verify published image
        if: github.event_name != 'pull_request' && steps.values.outputs.push == 'true' && steps.values.outputs.skip != 'true'
        env:
          IMAGE_TAG: ${{ steps.values.outputs.image_tag }}
          PUBLISH_LATEST: ${{ steps.values.outputs.publish_latest }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE:$IMAGE_TAG"
          docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -Fx "$GITHUB_SHA"
          if [[ "$PUBLISH_LATEST" == "true" ]]; then
            docker pull "$IMAGE:latest"
            test "$(docker image inspect "$IMAGE:$IMAGE_TAG" --format '{{.Id}}')" = "$(docker image inspect "$IMAGE:latest" --format '{{.Id}}')"
          fi

      - name: Tag the published fork commit
        if: github.event_name != 'pull_request' && steps.values.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.values.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
