name: Sync upstream

# Brings upstream commits into the fork's main without opening a PR when no
# human judgment is needed. fork-features/upstream-sync/sync-merge.mjs plans
# each run against origin/main:
#
#   - The longest prefix of upstream commits that merges without review becomes
#     one merge commit (parents: main, upstream target). The planner keeps the
#     fork-deleted rows of fork-features/ownership.tsv deleted when upstream
#     edits them; that is the only conflict it resolves.
#   - That candidate is built on the CachyOS runner by fork-docker.yml in
#     build-only mode (both role images, nothing pushed). Only if both build,
#     it is pushed to main as a fast-forward. The push itself is the guard: if
#     main moved since planning, the non-fast-forward push is rejected and the
#     next run replans. main's push then publishes the release as usual.
#   - A candidate that fails to build opens one labeled PR from `sync/merge`
#     so a human sees the failure.
#   - Whatever is left after the first commit that needs review (another
#     conflict, or a new upstream workflow file) goes onto `sync/review` as one
#     labeled PR, left open for a human.
#
# Any open PR with the `upstream-sync` label stops the run before planning, so
# a sync branch is never force-pushed while a human may be working on it. The
# planner and its fork-deleted allowlist come from the fork's main, never from
# upstream, so upstream cannot authorize its own resolution.

on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/getpaseo/paseo.git
  UPSTREAM_BRANCH: main
  BASE_BRANCH: main
  MERGE_BRANCH: sync/merge
  REVIEW_BRANCH: sync/review
  SYNC_LABEL: upstream-sync

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      # PAT, not GITHUB_TOKEN: GITHUB_TOKEN cannot push upstream changes to
      # .github/workflows/*, and its pushes would not trigger the main-push
      # publication in fork-docker.yml.
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
    outputs:
      outcome: ${{ steps.plan.outputs.outcome }}
      base: ${{ steps.plan.outputs.base }}
      merge_commit: ${{ steps.plan.outputs.merge_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Skip while a sync PR is open
        id: gate
        run: |
          set -euo pipefail
          gh label create "$SYNC_LABEL" --repo "$REPO" --color ededed \
            --description "Automated upstream-sync PR" >/dev/null 2>&1 || true
          open="$(gh pr list --repo "$REPO" --label "$SYNC_LABEL" --state open --json number --jq 'length')"
          if [[ "$open" -gt 0 ]]; then
            echo "An upstream-sync PR is still open; resolve it first."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan
        id: plan
        if: steps.gate.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          git fetch upstream "$UPSTREAM_BRANCH"
          git fetch origin "$BASE_BRANCH"
          plan="$(node fork-features/upstream-sync/sync-merge.mjs \
            --base "origin/$BASE_BRANCH" --upstream "upstream/$UPSTREAM_BRANCH")"
          echo "Sync plan: $plan"
          PLAN="$plan" node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          const plan = JSON.parse(process.env.PLAN ?? "");
          console.log(`outcome=${plan.outcome}`);
          console.log(`base=${plan.base}`);
          console.log(`merge_commit=${plan.mergeCommit ?? ""}`);
          NODE

      # The candidate exists only in this runner's object store until pushed;
      # the build job checks it out from this branch.
      - name: Publish candidate to the merge branch
        if: steps.plan.outputs.outcome == 'full' || steps.plan.outputs.outcome == 'prefix'
        env:
          MERGE_COMMIT: ${{ steps.plan.outputs.merge_commit }}
        run: |
          set -euo pipefail
          git push --force origin "$MERGE_COMMIT:refs/heads/$MERGE_BRANCH"

      - name: Open the review PR
        if: steps.plan.outputs.outcome == 'none'
        run: |
          set -euo pipefail
          git push --force origin "upstream/$UPSTREAM_BRANCH:refs/heads/$REVIEW_BRANCH"
          number="$(fork-features/upstream-sync/open-sync-pr.sh "$REVIEW_BRANCH" "$BASE_BRANCH" \
            "Sync upstream — needs review → $(date +%F)" \
            $'Automated sync — the next upstream commit needs a human: a conflict outside the fork-deleted paths, or a new upstream workflow file.\n\nResolve it here, then merge. Upstream edits to `fork-deleted` paths in `fork-features/ownership.tsv` are resolved by keeping the path deleted. Sync runs are paused while this PR is open.')"
          echo "Opened review PR #$number."

  build:
    needs: plan
    if: needs.plan.outputs.outcome == 'full' || needs.plan.outputs.outcome == 'prefix'
    permissions:
      contents: write
    uses: ./.github/workflows/fork-docker.yml
    with:
      ref: ${{ needs.plan.outputs.merge_commit }}

  land:
    needs: [plan, build]
    # A skipped callee job also reports success, so require the explicit output.
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      OUTCOME: ${{ needs.plan.outputs.outcome }}
      MERGE_COMMIT: ${{ needs.plan.outputs.merge_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Fast-forward main to the built candidate
        run: |
          set -euo pipefail
          git fetch origin "$MERGE_BRANCH"
          test "$(git rev-parse "origin/$MERGE_BRANCH")" = "$MERGE_COMMIT"
          # No force: if main moved after planning this push is rejected.
          git push origin "$MERGE_COMMIT:refs/heads/$BASE_BRANCH"
          git push origin --delete "$MERGE_BRANCH"
          echo "main fast-forwarded to $MERGE_COMMIT."

      - name: Open the review PR for the remaining tail
        if: env.OUTCOME == 'prefix'
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM" 2>/dev/null || true
          git fetch upstream "$UPSTREAM_BRANCH"
          git push --force origin "upstream/$UPSTREAM_BRANCH:refs/heads/$REVIEW_BRANCH"
          number="$(fork-features/upstream-sync/open-sync-pr.sh "$REVIEW_BRANCH" "$BASE_BRANCH" \
            "Sync upstream — needs review → $(date +%F)" \
            $'Automated sync — main already contains the upstream prefix that merged without review. The commits here need a human: a conflict outside the fork-deleted paths, or a new upstream workflow file.\n\nResolve them here, then merge. Sync runs are paused while this PR is open.')"
          echo "Opened review PR #$number."

  report-build-failure:
    needs: [plan, build]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.outcome == 'full' || needs.plan.outputs.outcome == 'prefix') &&
      needs.build.outputs.built != 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      REPO: ${{ github.repository }}
      OWNER: ${{ github.repository_owner }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT }}

      - name: Open a PR for the failed candidate
        run: |
          set -euo pipefail
          number="$(fork-features/upstream-sync/open-sync-pr.sh "$MERGE_BRANCH" "$BASE_BRANCH" \
            "Sync upstream — candidate failed to build → $(date +%F)" \
            "Automated sync — this upstream merge has no conflicts but did not build on the fork runner: $RUN_URL. Fix it on this branch and merge. Sync runs are paused while this PR is open.")"
          echo "Opened PR #$number for the failed candidate."
